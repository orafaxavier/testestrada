<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STRADA H&amp;G</title>
<meta name="description" content="Logística da turnê Hugo &amp; Guilherme">
<meta name="theme-color" content="#6d0809">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STRADA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
#boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1a0a0a;color:#fefda6;font:700 13px/1.4 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:24px}
#boot img{width:84px;height:84px;border-radius:20px}
#boot p{margin:0;max-width:320px;text-transform:none;letter-spacing:0;font-weight:500;opacity:.85}
#strada-upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 10px);z-index:9999;background:#e6934a;color:#1a0a0a;border:0;border-radius:99px;padding:10px 16px;font:800 13px system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35)}
</style>
<style id="css">
/* Layout: identidade "Colecionando Momentos" — fundo noite (vinho → azul profundo), creme como acento, gradiente vermelho/laranja do pôster nas aberturas. Coluna única mobile, régua de dias, timeline vertical, abas embaixo. Tema escuro único. */
:root{
  color-scheme:dark;
  --case:#140b12; --case-2:#211420; --case-3:#2e1c2b; --line:#3d2738;
  --ink:#fdf8e4; --ink-2:#c9b8ae; --ink-3:#8a7480;
  --tape:#fefda6; --tape-ink:#3a0a06; --alert:#ff4a2e; --ok:#7fd1a8;
  --red:#a81300; --wine:#6d0809; --orange:#d96f3e; --amber:#e6934a; --blue:#253c77; --blue-2:#3556a8;
  --grad:linear-gradient(160deg,#a81300 0%,#c84418 30%,#d96f3e 52%,#8a3a4a 76%,#253c77 100%);
  --t-art:#fefda6; --t-prod:#ff7a00; --t-tec:#2f86ff; --t-band:#ff2a3c; --t-cont:#00c96b; --t-nd:#b3a2ad; --t-artc:#ff3d9a; --t-trip:#00bde8; --t-seg:#a860ff; --t-bus:#ffc400; --t-om:#9be22d;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{background:var(--case);color:var(--ink)}
body{font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(168,19,0,.35),transparent 60%),linear-gradient(180deg,transparent 40%,rgba(37,60,119,.25));background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--case)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:900;letter-spacing:.01em;text-transform:uppercase;line-height:.9}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:20px;height:20px;flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--case);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px))}
.top-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px}
.brand img{width:30px;height:30px}
.brand b{font-family:var(--f-display);font-size:26px;font-weight:900;letter-spacing:.03em;line-height:1;color:#fefda6}.secband{background:#fefda6!important}
.brand span{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;line-height:1.2}
.me-chip{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--case-2);border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#111;flex:none}
.adm-tag{font-size:10px;font-weight:800;letter-spacing:.1em;background:var(--tape);color:var(--tape-ink);padding:2px 6px;border-radius:4px}

/* day strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.daychip{flex:none;min-width:84px;text-align:left;background:var(--case-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:grid;gap:2px}
.daychip .n{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:.9}
.daychip .c{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.daychip[aria-pressed="true"]{background:var(--grad);color:var(--ink);border-color:transparent}
.daychip[aria-pressed="true"] .c{color:var(--ink)}
.daychip .dot{width:6px;height:6px;border-radius:50%;background:var(--alert);display:inline-block;margin-left:4px;vertical-align:middle}

/* day hero */
.dayhero{padding:22px 0 6px;display:grid;gap:10px;position:relative}
.dayhero::before{content:"";position:absolute;inset:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) auto;height:200px;background:var(--grad);opacity:.85;z-index:0;pointer-events:none;-webkit-mask:linear-gradient(#000 30%,transparent);mask:linear-gradient(#000 30%,transparent)}
.dayhero>*{position:relative;z-index:1}
.dayhero .eyebrow{color:var(--ink)}
.dayhero h1{margin:0;font-size:clamp(44px,13vw,72px);text-wrap:balance}
.dayhero h1{color:var(--tape)}
.dayhero .uf{display:inline-block;font-family:var(--f-mono);font-size:14px;border-radius:4px;padding:2px 7px;vertical-align:super;margin-left:6px;background:var(--blue);color:var(--ink)}
.events{display:grid;gap:8px}
.event{background:var(--case-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.event-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.etype{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--case-3);color:var(--ink)}
.etype.show{background:var(--tape);color:var(--tape-ink)}
.etype.tv{background:var(--blue-2);color:var(--ink)}
.event-name{font-weight:700}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kv div{display:grid;gap:2px;min-width:0}
.kv dt{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:14px;font-weight:700}
.ni{font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--ink-3);border:1px dashed var(--ink-3);border-radius:4px;padding:1px 5px;white-space:nowrap;display:inline-block}

/* segmented */
.seg{display:flex;background:var(--case-2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:7px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--case)}

.sec{margin-top:26px;display:grid;gap:10px}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.sec-h .tape{height:2px;flex:1;background:linear-gradient(90deg,var(--orange),var(--red) 40%,var(--blue) 80%,transparent);border-radius:2px}
.sec-h .add{margin-left:auto}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}
.tl li{display:grid;grid-template-columns:58px 30px minmax(0,1fr);gap:0 8px;position:relative;padding-bottom:12px}
.tl li::before{content:"";position:absolute;left:calc(58px + 8px + 14px);top:30px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .t{font-family:var(--f-mono);font-weight:700;font-size:17px;padding-top:6px;text-align:right}
.tl .node{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#111;margin-top:2px;position:relative;z-index:1}
.tl .node svg{width:18px;height:18px}
.card{background:var(--case-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;min-width:0}
.card.mine{border-color:color-mix(in srgb,var(--tape) 55%,var(--line))}
.card.dim{opacity:.45}
.card-t{font-weight:700;font-size:15.5px;line-height:1.3}
.card-n{font-size:13.5px;color:var(--ink-2)}
.who{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--case-3);color:var(--ink-2);border:0}
.pill.you{background:var(--tape);color:var(--tape-ink)}
.pill.not{background:color-mix(in srgb,var(--alert) 22%,transparent);color:#ffb3ad}
.upd{font-size:10px;font-weight:800;letter-spacing:.12em;background:var(--alert);color:#fff;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.card-top{display:flex;gap:8px;align-items:flex-start}
.card-top .card-t{flex:1;min-width:0}
.edit{border:1px solid var(--line);background:var(--case-3);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;color:var(--ink-2)}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;background:var(--case-3);color:var(--ink)}
.btn.primary{background:var(--tape);color:var(--tape-ink)}
.btn.ghost{background:none;border:1px dashed var(--line);color:var(--ink-2)}
.btn.danger{background:none;color:var(--alert);border:1px solid color-mix(in srgb,var(--alert) 50%,transparent)}

/* boarding pass */
.pass{background:var(--tape);color:#2a0a08;border-radius:var(--r);display:grid;grid-template-columns:minmax(0,1fr) 92px;overflow:hidden;position:relative}
.pass .main{padding:12px 14px;display:grid;gap:8px;min-width:0}
.pass .stub{border-left:2px dashed rgba(58,10,6,.35);padding:12px 10px;display:grid;align-content:center;gap:4px;text-align:center;background:var(--amber);color:#2a0a08}
.pass .stub b{font-family:var(--f-mono);font-size:20px}
.pass .cia{display:flex;gap:8px;align-items:center;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.pass .route{display:flex;align-items:center;gap:8px;min-width:0}
.pass .route .c{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,6.4vw,30px);line-height:.9;text-transform:uppercase;min-width:0;overflow-wrap:normal;word-break:normal}
.pass .route{flex-wrap:wrap}
.pass .route svg{width:22px;height:22px;flex:none}
.pass .times{display:flex;gap:16px}
.pass .times div{display:grid}
.pass .times dt{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5e5d57}
.pass .times dd{margin:0;font-family:var(--f-mono);font-weight:700;font-size:16px}
.pass .ni{color:#6b6a63;border-color:#8d8b82}
.pass .pax{font-size:12px;color:#3c3b37}
.pass.jet{background:#dfe6fb;color:#0e1a3d}
.pass.jet .stub{background:var(--blue-2);color:var(--ink)}
.pass.jet .stub .eyebrow{color:var(--ink)!important}
.flag{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--alert) 14%,var(--case-2));border:1px solid color-mix(in srgb,var(--alert) 45%,transparent);color:#ffcfca;border-radius:8px;padding:8px 10px}
.flag.info{background:var(--case-2);border-color:var(--line);color:var(--ink-2)}
.flag svg{width:16px;height:16px;flex:none;margin-top:2px}

/* route */
.route-card{background:var(--case-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.rline{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.rline .d{width:14px;height:14px;border-radius:50%;border:3px solid var(--t-tec);background:var(--case)}
.rline .d.stop{width:10px;height:10px;border-width:2px;margin-left:2px;border-color:var(--ink-3)}
.rline .bar{grid-column:1;width:2px;height:18px;background:repeating-linear-gradient(var(--t-tec) 0 4px,transparent 4px 8px);margin-left:6px}
.rline .nm{font-weight:700}
.rline .nm.stop{font-weight:500;color:var(--ink-2);font-size:13px}
.rline .tm{font-family:var(--f-mono);font-weight:700}
.link{color:var(--t-tec);font-weight:700;font-size:13px;text-decoration:none}
.link:hover{text-decoration:underline}

/* empty */
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;color:var(--ink-2);font-size:13.5px}
.empty b{color:var(--ink);font-size:14px}

/* vans / hotel */
.vans{display:grid;gap:8px}
.van{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--case-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 0;overflow:hidden}
.van .stripe{align-self:stretch;margin:-10px 0}
.busph{display:block;width:100%;height:auto;aspect-ratio:2/1;object-fit:cover;border-radius:8px;margin:2px 0 10px;background:#000}
.veh{display:grid;gap:4px;background:var(--case-2);border:1px solid var(--line);border-left:6px solid var(--tape);border-radius:var(--r);padding:10px 12px}
.veh .pl{font-family:var(--f-mono);font-weight:700;letter-spacing:.04em}
.legs{display:grid;gap:6px;margin-top:10px}
.leg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;background:var(--case-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.leg small{grid-column:1/-1;color:var(--ink-2);font-size:12px}
.livebar{margin:12px 0 0;border:1px solid var(--line);border-left:6px solid var(--lc,var(--tape));border-radius:var(--r);background:var(--case-2);padding:10px 12px;display:grid;gap:6px}
.livebar .lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.livebar .dot{width:9px;height:9px;border-radius:50%;background:var(--alert);box-shadow:0 0 0 0 rgba(255,74,46,.6);animation:lp 1.6s infinite}
@keyframes lp{70%{box-shadow:0 0 0 8px rgba(255,74,46,0)}100%{box-shadow:0 0 0 0 rgba(255,74,46,0)}}
@media (prefers-reduced-motion:reduce){.livebar .dot{animation:none}}
.livebar .lt{font-size:17px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.livebar .lm{font-size:12px;color:var(--ink-2)}
.livebar .lbtn{background:none;border:0;color:var(--t-tec);font-weight:800;font-size:12px;padding:4px 0;cursor:pointer;margin-left:auto}
.livelist{display:grid;gap:6px;margin-top:4px}
.liverow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;border-top:1px solid var(--line);padding-top:6px}
.liverow .tm{font-family:var(--f-mono);font-weight:700;font-size:14px}
.liverow .x{background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:6px;font-size:11px;padding:3px 6px;cursor:pointer}
.ltag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;color:#160406}
.livefab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--alert);color:#fff;border:0;border-radius:999px;padding:12px 16px;font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;cursor:pointer}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{background:var(--case);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 10px;font-size:13px;font-weight:700;cursor:pointer}
.presets button[aria-pressed=true]{border-color:var(--tape);color:var(--tape)}
.rmap{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin:2px 0 6px;background:var(--case)}
.rcap{font-size:11px;color:var(--ink-3);margin-bottom:10px}
.prio{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:pr}
.prio li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--case-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;counter-increment:pr}
.prio li::before{content:counter(pr);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--tape);color:var(--tape-ink);font-weight:900;font-size:13px}
.prio .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.prio .v{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.prio .tm{font-family:var(--f-mono);font-weight:700;font-size:17px;color:var(--tape);text-align:right}
.count{display:inline-block;margin-top:6px;background:var(--tape);color:var(--tape-ink);font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.btnrow{display:grid;gap:8px;margin-top:14px}
.btnrow .btn{justify-content:center;text-align:center;padding:12px}
.rbox{position:relative}
.rbox iframe{display:block;width:100%;aspect-ratio:1.6/1;border:1px solid var(--line);border-radius:8px;margin:2px 0 6px;background:var(--case)}
.navbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.navbtns a{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px 8px;font-weight:800;font-size:13px;text-decoration:none;color:var(--ink);background:var(--case)}
.navbtns a svg{width:16px;height:16px}
.secband{height:5px;border-radius:3px;background:var(--tape);margin-top:8px}
.seclist{display:grid;gap:6px}
.secitem{background:var(--case-2);border:1px solid var(--line);border-left:6px solid var(--tape);border-radius:var(--r);padding:10px 12px}
.secitem .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.secitem .v{font-weight:700;overflow-wrap:anywhere}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.catbtn{display:grid;gap:2px;text-align:left;border:1px solid var(--line);border-left:8px solid var(--cc);border-radius:var(--r);background:rgba(0,0,0,.35);color:#fff;padding:14px 12px;cursor:pointer}
.catbtn b{font-size:16px;font-weight:800}
.catbtn span{font-size:12px;opacity:.8}
.catback{background:none;border:0;color:inherit;font-weight:800;font-size:14px;padding:8px 0;cursor:pointer;opacity:.9}
.chatbtn{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--case-2);color:var(--ink);border-radius:999px;padding:7px 11px;font-weight:800;font-size:13px;margin-right:8px;cursor:pointer}
.chatbtn svg{width:17px;height:17px}
.chatbtn .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--alert);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
